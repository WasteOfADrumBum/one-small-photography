name: Production smoke

# Read-only checks of the live site: pages load, photos are served, the admin
# stays locked and security headers are present. A failed scheduled run emails
# the repo owner (GitHub's default for failed workflows), which is the site's
# free uptime alert. Nothing here signs in or changes data.
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/smoke.mjs
      - scripts/lib/smoke.mjs
      - .github/workflows/production-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/smoke.mjs https://photo.onesmall.company
