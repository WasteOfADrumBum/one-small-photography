name: Browser tests (Firefox, WebKit)

# The full browser suite on the two engines pull requests do not run, weekly
# and by hand. Same disposable database, temporary photo folder and synthetic
# account as the Chromium run in CI. A failure opens one "production-alert"
# issue (kind: browsers); the next pass closes it.
on:
  schedule:
    - cron: '41 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: browsers
  cancel-in-progress: false

env:
  E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  browsers:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    services:
      postgres:
        image: postgres:16@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32 # 16, pinned 2026-11-05
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install ${{ matrix.browser }}
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright install --with-deps "$BROWSER"
      - name: Build the site for local serving
        run: npm run build:e2e
      - name: Run the browser tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm run test:e2e -- "--project=$BROWSER"
      - name: Summarise results and flag flaky tests
        if: always()
        run: node scripts/ci/e2e-summary.mjs
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            !test-results/**/*.auth*
          retention-days: 7
          if-no-files-found: ignore

  report:
    name: Record the result
    needs: browsers
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write # open or close the one alert issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.browsers.result }}
        run: |
          if [[ "$RESULT" == "success" ]]; then
            node scripts/ci/alert-issue.mjs close browsers "Firefox and WebKit browser tests pass again."
          else
            node scripts/ci/alert-issue.mjs open browsers "Weekly Firefox/WebKit browser tests failed" \
              "The weekly browser tests on Firefox or WebKit ended as: $RESULT. Open the run for the report and traces."
          fi
